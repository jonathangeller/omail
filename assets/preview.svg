  <rect x="32" y="386" width="3" height="14" rx="1.5" fill="#5cb85c"/>
  <text x="44" y="397" fill="#9aa2b1" font-size="11.5">you@example.com</text>
  <rect x="32" y="414" width="3" height="14" rx="1.5" fill="#e2a03f"/>
  <text x="44" y="425" fill="#9aa2b1" font-size="11.5">personal@example.net</text>
  <rect x="32" y="442" width="3" height="14" rx="1.5" fill="#e5679a"/>
  <text x="44" y="453" fill="#9aa2b1" font-size="11.5">work@example.org</text>
  <rect x="32" y="470" width="3" height="14" rx="1.5" fill="#4d9fe8"/>
  <text x="44" y="481" fill="#9aa2b1" font-size="11.5">projects@example.dev</text>
  <rect x="32" y="498" width="3" height="14" rx="1.5" fill="#986ee2"/>
  <text x="44" y="509" fill="#9aa2b1" font-size="11.5">alerts@example.dev</text>

  <!-- the user bar names the merged view -->
  <line x1="28" y1="640" x2="168" y2="640" stroke="#252932"/>
  <circle cx="40" cy="662" r="9" fill="#5cb85c"/>
  <text x="40" y="666" fill="#12141a" font-size="10" font-weight="bold" text-anchor="middle">J</text>
  <text x="58" y="666" fill="#9aa2b1" font-size="11.5">All mailboxes</text>

  <!-- search -->
  <rect x="196" y="60" width="352" height="30" rx="4" fill="#141720" stroke="#252932"/>
  <text x="212" y="79" fill="#6b7280" font-size="11.5">/  search all mailboxes</text>

  <g clip-path="url(#cardrows)">
    <!-- row 1 — green, unread, selected: the message the reader shows -->
    <rect x="196" y="112" width="352" height="62" rx="4" fill="#1f2430"/>
    <rect x="196" y="112" width="3" height="62" rx="1.5" fill="#5cb85c"/>
    <circle cx="212" cy="130" r="3" fill="#4d9fe8"/>
    <text x="224" y="134" fill="#e6e9ef" font-size="11.5" font-weight="bold">Helpdesk</text>
    <text x="532" y="134" fill="#6b7280" font-size="10.5" text-anchor="end">21:28</text>
    <text x="224" y="151" fill="#e6e9ef" font-size="11.5">[Comment] [Support #4XKQ2] Call logs</text>
    <text x="224" y="168" fill="#5c6472" font-size="10.5">A comment was added to the ticket</text>

    <!-- row 2 — amber -->
    <rect x="196" y="178" width="352" height="62" rx="4" fill="#191d26"/>
    <rect x="196" y="178" width="3" height="62" rx="1.5" fill="#e2a03f"/>
    <text x="224" y="200" fill="#c8cfdb" font-size="11.5">Alex Rivera</text>
    <text x="532" y="200" fill="#6b7280" font-size="10.5" text-anchor="end">20:41</text>
    <text x="224" y="217" fill="#c8cfdb" font-size="11.5">Re: Quarterly report</text>
    <text x="224" y="234" fill="#5c6472" font-size="10.5">Thanks for sending those figures over…</text>

