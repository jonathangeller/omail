    <text x="532" y="530" fill="#6b7280" font-size="10.5" text-anchor="end">14:02</text>
    <text x="224" y="547" fill="#c8cfdb" font-size="11.5">Your transfer was deposited</text>
    <text x="224" y="564" fill="#5c6472" font-size="10.5">The funds have landed in your account</text>

    <!-- row 8 — blue -->
    <rect x="196" y="574" width="352" height="62" rx="4" fill="#191d26"/>
    <rect x="196" y="574" width="3" height="62" rx="1.5" fill="#4d9fe8"/>
    <text x="224" y="596" fill="#c8cfdb" font-size="11.5">Dana Okafor</text>
    <text x="532" y="596" fill="#6b7280" font-size="10.5" text-anchor="end">12:38</text>
    <text x="224" y="613" fill="#c8cfdb" font-size="11.5">Re: Staging cutover</text>
    <text x="224" y="630" fill="#5c6472" font-size="10.5">Confirmed for Friday morning — the…</text>
