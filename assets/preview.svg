    <rect x="196" y="244" width="3" height="62" rx="1.5" fill="#e5679a"/>
    <circle cx="212" cy="262" r="3" fill="#4d9fe8"/>
    <text x="224" y="266" fill="#e6e9ef" font-size="11.5" font-weight="bold">Network Ops</text>
    <text x="532" y="266" fill="#6b7280" font-size="10.5" text-anchor="end">19:07</text>
    <text x="224" y="283" fill="#e6e9ef" font-size="11.5" font-weight="bold">Scheduled maintenance — core rout…</text>
    <text x="224" y="300" fill="#5c6472" font-size="10.5">A maintenance window is scheduled for…</text>

    <!-- row 4 — blue, with an attachment -->
    <rect x="196" y="310" width="352" height="62" rx="4" fill="#191d26"/>
    <rect x="196" y="310" width="3" height="62" rx="1.5" fill="#4d9fe8"/>
    <text x="224" y="332" fill="#c8cfdb" font-size="11.5">Sam Chen</text>
    <text x="532" y="332" fill="#6b7280" font-size="10.5" text-anchor="end">17:52</text>
    <text x="224" y="349" fill="#c8cfdb" font-size="11.5">Q3 invoice</text>
    <g transform="translate(224 358)">
      <path d="M6.2 1.6a2.4 2.4 0 013.4 3.4L5 9.6a1.4 1.4 0 01-2-2l4.2-4.2" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-linecap="round"/>
    </g>
    <text x="240" y="366" fill="#5c6472" font-size="10.5">invoice-q3.pdf · 84 KB</text>

    <!-- row 5 — purple, starred -->
    <rect x="196" y="376" width="352" height="62" rx="4" fill="#191d26"/>
    <rect x="196" y="376" width="3" height="62" rx="1.5" fill="#986ee2"/>
    <text x="224" y="398" fill="#c8cfdb" font-size="11.5">GitHub</text>
    <path d="M523 391.5l1.5 3.1 3.4.5-2.45 2.4.58 3.4-3.03-1.6-3.03 1.6.58-3.4-2.45-2.4 3.4-.5z" fill="#e2a03f"/>
    <text x="512" y="398" fill="#6b7280" font-size="10.5" text-anchor="end">16:30</text>
    <text x="224" y="415" fill="#c8cfdb" font-size="11.5">[omail] Deploy succeeded</text>
    <text x="224" y="432" fill="#5c6472" font-size="10.5">Workflow run completed in 42s</text>

    <!-- row 6 — green, an invitation -->
    <rect x="196" y="442" width="352" height="62" rx="4" fill="#191d26"/>
    <rect x="196" y="442" width="3" height="62" rx="1.5" fill="#5cb85c"/>
    <text x="224" y="464" fill="#c8cfdb" font-size="11.5">Jordan Blake</text>
