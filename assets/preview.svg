<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="713" viewBox="0 0 1000 713" font-family="JetBrains Mono, DejaVu Sans Mono, monospace">
  <defs>
    <clipPath id="cardrows"><rect x="196" y="112" width="352" height="560"/></clipPath>
  </defs>

  <!-- window ground -->
  <rect width="1000" height="713" fill="#12141a"/>

  <!-- bar: the widget is the unread badge, which is what the plugin adds -->
  <rect x="0" y="0" width="1000" height="30" fill="#0d0f14"/>
  <text x="16" y="20" fill="#6b7280" font-size="12">omarchy</text>
  <g transform="translate(896 9)">
    <rect x="0" y="0" width="15" height="11" rx="2" fill="none" stroke="#9aa0a6" stroke-width="1.4"/>
    <path d="M4 3.4l3.5 3.6L11 3.4" fill="none" stroke="#e5534b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <circle cx="920" cy="12" r="7" fill="#e5534b"/>
  <text x="920" y="16" fill="#12141a" font-size="9" font-weight="bold" text-anchor="middle">12</text>
  <text x="948" y="20" fill="#6b7280" font-size="12">21:28</text>

  <!-- window -->
  <rect x="12" y="42" width="976" height="655" rx="6" fill="#171a21" stroke="#252932"/>

  <!-- rail -->
  <rect x="12" y="42" width="172" height="655" rx="6" fill="#141720"/>
  <rect x="172" y="42" width="12" height="655" fill="#141720"/>

  <!-- the mark, so the card carries the app's own identity -->
  <g transform="translate(30 58) scale(0.34)">
    <g fill="none" stroke="#8ab4f8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5.5" y="13.5" width="53" height="37" rx="7"/>
      <path d="M8.5 16l7.5 8.5M55.5 16L48 24.5"/>
      <circle cx="32" cy="32.5" r="10.5"/>
    </g>
  </g>
  <text x="58" y="79" fill="#e6e9ef" font-size="14">Omail</text>

  <text x="32" y="116" fill="#8b93a1" font-size="11" letter-spacing="1.2">MAILBOXES</text>

  <!-- the merged view, selected -->
  <rect x="24" y="130" width="148" height="30" rx="4" fill="#1f2430"/>
  <rect x="24" y="130" width="3" height="30" rx="1.5" fill="#7c8496"/>
  <text x="40" y="149" fill="#e6e9ef" font-size="12">All mailboxes</text>
  <text x="160" y="149" fill="#8b93a1" font-size="11" text-anchor="end">12</text>

  <text x="40" y="183" fill="#9aa2b1" font-size="12">Inbox</text>
  <text x="160" y="183" fill="#6b7280" font-size="11" text-anchor="end">48</text>
  <text x="40" y="211" fill="#9aa2b1" font-size="12">Unread</text>
  <text x="160" y="211" fill="#6b7280" font-size="11" text-anchor="end">12</text>
  <text x="40" y="239" fill="#9aa2b1" font-size="12">Starred</text>
  <text x="40" y="267" fill="#9aa2b1" font-size="12">Sent</text>
  <text x="40" y="295" fill="#9aa2b1" font-size="12">Archive</text>
  <text x="40" y="323" fill="#9aa2b1" font-size="12">Trash</text>

