  <!-- reader -->
  <line x1="560" y1="42" x2="560" y2="697" stroke="#252932"/>

  <rect x="584" y="60" width="3" height="44" rx="1.5" fill="#5cb85c"/>
  <text x="600" y="78" fill="#e6e9ef" font-size="15">[Comment] [Support #4XKQ2]</text>
  <text x="600" y="98" fill="#e6e9ef" font-size="15">Call Logs</text>

  <circle cx="600" cy="132" r="11" fill="#2a2f3a"/>
  <text x="600" y="136" fill="#9aa2b1" font-size="10" text-anchor="middle">S</text>
  <text x="620" y="128" fill="#c8cfdb" font-size="12">Helpdesk</text>
  <text x="964" y="128" fill="#6b7280" font-size="11" text-anchor="end">Sep 3, 21:28</text>
  <text x="620" y="145" fill="#6b7280" font-size="11">support@example.com → you@example.com</text>

  <line x1="584" y1="164" x2="964" y2="164" stroke="#252932"/>

  <!-- remote images are blocked until asked for -->
  <rect x="584" y="180" width="380" height="34" rx="4" fill="#141720" stroke="#252932"/>
  <text x="600" y="202" fill="#8b93a1" font-size="11">Images in this message are blocked.</text>
  <text x="948" y="202" fill="#8ab4f8" font-size="11" text-anchor="end">Load images</text>

  <text x="584" y="244" fill="#c8cfdb" font-size="12">A new comment was added:</text>
  <text x="584" y="272" fill="#c8cfdb" font-size="12">The call logs for extension 203 are attached for the</text>
  <text x="584" y="292" fill="#c8cfdb" font-size="12">period requested. Records run from 1 Aug through</text>
  <text x="584" y="312" fill="#c8cfdb" font-size="12">31 Aug and include inbound, outbound and missed.</text>

  <rect x="584" y="336" width="3" height="46" rx="1.5" fill="#2a2f3a"/>
  <text x="600" y="354" fill="#8b93a1" font-size="12">&gt; Could you send the full call logs for</text>
  <text x="600" y="374" fill="#8b93a1" font-size="12">&gt; extension 203 for last month?</text>

  <text x="584" y="410" fill="#c8cfdb" font-size="12">Reply to this email to add another comment.</text>

  <!-- the attachment, which can be saved and opened -->
  <text x="584" y="452" fill="#8b93a1" font-size="11" letter-spacing="1.1">1 ATTACHMENT</text>
  <rect x="584" y="466" width="280" height="44" rx="4" fill="#141720" stroke="#252932"/>
  <g transform="translate(602 480)">
    <path d="M7.4 1.9a2.9 2.9 0 014.1 4.1L6 11.5a1.7 1.7 0 01-2.4-2.4l5-5" fill="none" stroke="#8b93a1" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <text x="626" y="486" fill="#c8cfdb" font-size="12">call-logs-203.csv</text>
  <text x="626" y="502" fill="#5c6472" font-size="10.5">18 KB · click to save and open</text>

  <line x1="584" y1="560" x2="964" y2="560" stroke="#252932"/>

  <!-- the keys, which is how the app is actually driven -->
  <rect x="584" y="582" width="82" height="30" rx="4" fill="#1f2430"/>
  <text x="600" y="602" fill="#8b93a1" font-size="11">r</text>
  <text x="614" y="602" fill="#c8cfdb" font-size="11">Reply</text>
  <rect x="676" y="582" width="100" height="30" rx="4" fill="#1f2430"/>
  <text x="692" y="602" fill="#8b93a1" font-size="11">a</text>
  <text x="706" y="602" fill="#c8cfdb" font-size="11">Reply all</text>
  <rect x="786" y="582" width="92" height="30" rx="4" fill="#1f2430"/>
  <text x="802" y="602" fill="#8b93a1" font-size="11">e</text>
  <text x="816" y="602" fill="#c8cfdb" font-size="11">Archive</text>
  <rect x="888" y="582" width="76" height="30" rx="4" fill="#1f2430"/>
  <text x="904" y="602" fill="#8b93a1" font-size="11">d</text>
  <text x="918" y="602" fill="#c8cfdb" font-size="11">Trash</text>

  <text x="964" y="656" fill="#5c6472" font-size="11" text-anchor="end">Ctrl+= zoom · ? shortcuts</text>
</svg>
